name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Un PR que recibe otro push cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Privacidad (correos, rutas con usuario, claves)
        run: node scripts/check-privacy.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
