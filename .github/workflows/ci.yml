name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Un PR que recibe otro push cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Privacidad (correos, rutas con usuario, claves)
        run: node scripts/check-privacy.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Las e2e abren la app con la ventana oculta y sus propios datos. Sin Claude ni red: las pruebas con
      # Claude real y las de red quedan omitidas porque piden HILO_E2E_CLAUDE o HILO_E2E_RED.
      - name: e2e
        run: npm run e2e
      - name: Resultados de las e2e si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
